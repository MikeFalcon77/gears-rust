name: Report Compare (mikepenz)

# FORK-ONLY: the same sandbox artifacts through mikepenz/action-junit-report,
# to compare against dorny in test-report.yml. Never port upstream.

on:
  workflow_run:
    workflows: ["Report Sandbox"]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: '*-tests-*'
          path: reports
      - run: find reports -type f
      - uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        with:
          report_paths: 'reports/rust-tests-*/*.xml'
          commit: ${{ github.event.workflow_run.head_sha }}
          check_name: 'mikepenz: Rust Tests / Sandbox'
          include_passed: false
          detailed_summary: true
      - uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3 # v6.6.0
        if: ${{ !cancelled() }}
        with:
          report_paths: 'reports/e2e-tests-*/*.xml'
          commit: ${{ github.event.workflow_run.head_sha }}
          check_name: 'mikepenz: E2E / sandbox'
          detailed_summary: true
